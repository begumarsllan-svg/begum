<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Soru 💕</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ffb6c1, #ffe4e1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Arial', sans-serif;
    overflow: hidden;
}

h1 {
    font-size: 28px;
    margin-bottom: 30px;
}

.buttons {
    position: relative;
}

button {
    font-size: 20px;
    padding: 12px 30px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    margin: 10px;
}

#yes {
    background-color: #ff4d6d;
    color: white;
}

#no {
    background-color: #777;
    color: white;
    position: absolute;
}

.result {
    font-size: 32px;
    margin-top: 40px;
    text-align: center;
}

/* Kalp animasyonu */
.heart {
    position: absolute;
    color: pink;
    font-size: 20px;
    animation: float 4s linear infinite;
}

@keyframes float {
    0% {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
    100% {
        transform: translateY(-600px) scale(1.8);
        opacity: 0;
    }
}
</style>
</head>

<body>

<h1>Begümden hoşlanıyor musun? 💭</h1>

<div class="buttons">
    <button id="yes" onclick="evet()">Evet</button>
    <button id="no" onmouseover="kac()">Hayır</button>
</div>

<div class="result" id="sonuc"></div>

<script>
function evet() {
    document.getElementById("sonuc").innerHTML =
        "Umuta aşığım 💖💗💞💘💝";
    kalpYagdir();
}

function kac() {
    const no = document.getElementById("no");
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 100);
    no.style.left = x + "px";
    no.style.top = y + "px";
}

function kalpYagdir() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "💖";
        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.bottom = "0px";
        heart.style.fontSize = (20 + Math.random() * 20) + "px";
        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 4000);
    }, 300);
}
</script>

</body>
</html>
